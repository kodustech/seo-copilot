# Apply supabase/migrations on every merge to main (and on manual dispatch).
# Secrets (repo): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF
name: db-migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # Format, not just presence. An invalid ref (a full URL, the project
          # name, a stray newline) passes an emptiness check and then dies four
          # steps later inside `db push` with "Invalid project ref format" —
          # which is how this workflow failed silently on every merge from
          # 2026-07-31 to 2026-08-04. A ref is 20 lowercase letters.
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing secret SUPABASE_PROJECT_REF"
            exit 1
          fi
          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -qE '^[a-z]{20}$'; then
            echo "SUPABASE_PROJECT_REF is not a valid project ref."
            echo "Expected 20 lowercase letters (got ${#SUPABASE_PROJECT_REF} chars)."
            echo "Copy it from the dashboard URL: .../dashboard/project/<ref>"
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing secret SUPABASE_DB_PASSWORD"
            exit 1
          fi
          # Password via env only (not --password / argv — visible in /proc cmdline).
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --yes
